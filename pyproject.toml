[project]
name = "news-credibility-classifier"
version = "0.1.0"
description = "A news credibility classifier using Streamlit"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "streamlit>=1.28.0",
    "joblib>=1.3.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = false

[tool.streamlit]
python_version = "3.10"
